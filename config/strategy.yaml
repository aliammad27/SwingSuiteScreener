schema_version: 5
profile_name: Bullish Weekly Participation v5
direction: bullish_only
validation_state: research_default

review_thresholds:
  trend: 80
  leadership: 70
  setup: 75
  timing: 75
  market: 70
  contract: 80
  risk: 70
  ready_verify_contract_minimum: 65

watchlist_thresholds:
  trend: 70
  leadership: 20
  setup: 60
  maximum_candidates: 10

opportunity_tiers:
  s_tier:
    minimum_composite: 88
    minimum_contract: 85
  a_plus:
    minimum_composite: 80
    minimum_contract: 65
  asymmetric:
    trend: 75
    leadership: 20
    setup: 70
    timing: 70
    market: 45
    risk: 65
    contract: 65
    minimum_target_to_expected_move: 1.0
    maximum_iv_to_realized_volatility: 1.75

catalyst:
  gap_minimum_atr: 0.75
  relative_volume_minimum: 1.50
  maximum_age_bars: 3
  require_gap_midpoint_hold: true

aggressive_weekly:
  enabled: true
  preferred_dte: [7, 10]
  hard_dte: [7, 12]
  intended_hold_sessions: [1, 2]
  requalify_dte: 7
  no_progress_sessions: 1
  minimum_trend: 90
  minimum_leadership: 75
  minimum_setup: 90
  minimum_timing: 90
  minimum_market: 80
  minimum_risk: 80
  require_pattern_confirmed: true
  allowed_patterns:
    - confirmed_breakout
    - breakout_retest

trade_economics:
  minimum_target_to_expected_move: 0.75
  realistic_target_to_expected_move: 1.50
  attractive_target_to_expected_move: 2.50
  maximum_target_to_expected_move: 4.00
  debit_spread_iv_to_realized_minimum: 1.25
  minimum_spread_reward_to_risk: 0.50

market:
  supportive_minimum: 70
  mixed_minimum: 45

patterns:
  production:
    - controlled_pullback
    - confirmed_breakout
    - bull_flag
    - breakout_retest
    - flat_base
    - vcp_tight_base
    - ascending_triangle
  context_only:
    - cup_with_handle
    - double_bottom
    - inverse_head_and_shoulders
    - falling_wedge
    - rounding_base
  ready_distance_atr: 0.30
  maximum_confirmed_extension_atr: 0.75
  maximum_confirmed_age_bars: 1

event_risk:
  leader_earnings_buffer_sessions: 2
  macro_post_event_completed_hours: 1
  maximum_source_age_hours: 24
  index_macro_events:
    - fomc
    - cpi
    - employment_situation

timing:
  entry_window_start_et: "10:30"
  entry_window_end_et: "14:45"
  final_hour_management_only: true
  minimum_completed_bars: 80

data_trust:
  required_stock_feed: sip
  required_option_feed: opra
  maximum_quote_age_minutes: 2

universe:
  minimum_price: 20
  minimum_average_daily_dollar_volume_usd: 100000000
  options_required: true

lanes:
  index_weekly:
    symbols: [SPY, QQQ]
    preferred_dte: [10, 16]
    hard_dte: [7, 21]
    preferred_delta: [0.60, 0.75]
    hard_delta: [0.50, 0.85]
    intended_hold_sessions: [1, 4]
    requalify_dte: 5
    no_progress_sessions: 2
    maximum_spread_percent: 3.0
    minimum_open_interest: 2000
    minimum_volume: 500
    minimum_bid_ask_size: 10
    maximum_theta_ask_percent: 5.0
    prefer_nonstandard_weekly: true
    monthly_liquidity_advantage_percent: 25.0
  leader_weekly:
    preferred_dte: [14, 21]
    hard_dte: [10, 24]
    preferred_delta: [0.55, 0.70]
    hard_delta: [0.45, 0.80]
    intended_hold_sessions: [1, 5]
    requalify_dte: 7
    no_progress_sessions: 2
    maximum_spread_percent: 5.0
    minimum_open_interest: 1000
    minimum_volume: 200
    minimum_bid_ask_size: 5
    maximum_theta_ask_percent: 6.0
    prefer_nonstandard_weekly: true
    monthly_liquidity_advantage_percent: 25.0
