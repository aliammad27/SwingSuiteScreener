services:
  - type: cron
    name: swingsuite-post-close
    runtime: docker
    schedule: "55 21,22 * * 1-5"
    dockerCommand: "python -m scanner.schedule_gate --target 18:00 --max-late-minutes 90 && python -m scanner.run_scan post_close"
  - type: cron
    name: swingsuite-premarket
    runtime: docker
    schedule: "0 10 * * 1-5"
    dockerCommand: "python -m scanner.schedule_gate --target 06:00 --max-late-minutes 180 && python -m scanner.run_scan premarket"
  - type: cron
    name: swingsuite-intraday-midday
    runtime: docker
    schedule: "30 16,17 * * 1-5"
    dockerCommand: "python -m scanner.run_scan intraday --scheduled"
