name: Post Close Scan

on:
  schedule:
    # 4:20 PM EST or 5:20 PM EDT. One dependable market-day digest avoids
    # duplicate backup runs while still using completed regular-session bars.
    - cron: "20 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swingsuite-post-close
  cancel-in-progress: true

jobs:
  post-close:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
      ALPACA_DATA_BASE_URL: https://data.alpaca.markets
      ALPACA_FEED: ${{ vars.ALPACA_FEED || 'iex' }}
      ALPACA_OPTION_FEED: ${{ vars.ALPACA_OPTION_FEED || 'indicative' }}
      ALPACA_MIN_REQUEST_INTERVAL_SECONDS: "0.45"
      ALPACA_MAX_RETRIES: "8"
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      TELEGRAM_BOT_USERNAME: AlisScreenerBot
      TELEGRAM_BOT_URL: https://t.me/AlisScreenerBot
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      STORAGE_BACKEND: local_json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore scanner state
        uses: actions/cache/restore@v5
        with:
          path: |
            data/state
            data/research
          key: swingsuite-state-${{ github.run_id }}
          restore-keys: |
            swingsuite-state-
      - name: Run post close scan
        run: python -m scanner.run_scan post_close
      - name: Evaluate completed research outcomes
        run: python -m scanner.run_scan evaluate-signals
      - name: Build research evidence report
        run: python -m scanner.run_scan research-report
      - name: Save scanner state
        if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            data/state
            data/research
          key: swingsuite-state-${{ github.run_id }}
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: post-close-report
          path: |
            reports/post_close/latest.md
            reports/post_close/latest.json
            reports/post_close/latest.html
            data/research/research.sqlite3
            reports/research/latest.md
            reports/research/latest.json
            logs/notifications.log
          if-no-files-found: ignore
