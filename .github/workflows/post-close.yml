name: Post Close Scan

on:
  schedule:
    # ET-first backups around 6:00 PM ET across daylight and standard time.
    # The schedule gate waits when early and rejects stale starts after 7:30 PM ET.
    - cron: "55 21,22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: swingsuite-post-close
  cancel-in-progress: false

jobs:
  post-close:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
      ALPACA_DATA_BASE_URL: https://data.alpaca.markets
      ALPACA_FEED: ${{ vars.ALPACA_FEED || 'iex' }}
      ALPACA_OPTION_FEED: ${{ vars.ALPACA_OPTION_FEED || 'indicative' }}
      ALPACA_MIN_REQUEST_INTERVAL_SECONDS: "0.45"
      ALPACA_MAX_RETRIES: "8"
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY || secrets.ALPHAVANTAGE_API_KEY || secrets.ALPHA_VANTAGE_KEY || secrets.ALPHAVANTAGE_APIKEY || '' }}
      TELEGRAM_BOT_USERNAME: AlisScreenerBot
      TELEGRAM_BOT_URL: https://t.me/AlisScreenerBot
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      STORAGE_BACKEND: local_json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore scanner state
        uses: actions/cache/restore@v5
        with:
          path: |
            data/state
            data/research
            data/raw
          key: swingsuite-state-${{ github.run_id }}
          restore-keys: |
            swingsuite-state-
      - name: Skip backup wakeup if already delivered
        if: github.event_name == 'schedule'
        id: dedupe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff=$(date -u -d '6 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          count=$(gh run list --workflow "${{ github.workflow }}" --event schedule --status success --limit 10 \
            --json createdAt --jq "[.[] | select(.createdAt >= \"$cutoff\")] | length" 2>/dev/null || echo 0)
          if [ "${count:-0}" -gt 0 ]; then
            echo "A scheduled run of this workflow already succeeded in the current window."
            echo "Skipping duplicate backup wakeup cleanly (no stale alert, no red failure)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "No prior success in the current window; proceeding to the schedule gate."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Wait until 6:00 PM ET
        if: github.event_name == 'schedule' && steps.dedupe.outputs.skip != 'true'
        run: python -m scanner.schedule_gate --target 18:00 --max-late-minutes 90
      - name: Run post close scan
        if: steps.dedupe.outputs.skip != 'true'
        run: python -m scanner.run_scan post_close
      - name: Evaluate completed research outcomes
        if: steps.dedupe.outputs.skip != 'true'
        run: python -m scanner.run_scan evaluate-signals
      - name: Build research evidence report
        if: steps.dedupe.outputs.skip != 'true'
        run: python -m scanner.run_scan research-report
      - name: Save scanner state
        if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            data/state
            data/research
            data/raw
          key: swingsuite-state-${{ github.run_id }}
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: post-close-report
          path: |
            reports/post_close/latest.md
            reports/post_close/latest.json
            reports/post_close/latest.html
            data/research/research.sqlite3
            reports/research/latest.md
            reports/research/latest.json
            logs/notifications.log
          if-no-files-found: ignore
