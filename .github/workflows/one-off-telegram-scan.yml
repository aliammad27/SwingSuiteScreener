name: One Off Telegram Scan

on:
  push:
    paths:
      - ".github/workflows/one-off-telegram-scan.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swingsuite-one-off-telegram-scan
  cancel-in-progress: false

jobs:
  one-off-intraday:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
      ALPACA_DATA_BASE_URL: https://data.alpaca.markets
      ALPACA_FEED: ${{ vars.ALPACA_FEED || 'iex' }}
      ALPACA_OPTION_FEED: ${{ vars.ALPACA_OPTION_FEED || 'indicative' }}
      ALPACA_MIN_REQUEST_INTERVAL_SECONDS: "0.45"
      ALPACA_MAX_RETRIES: "8"
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY || secrets.ALPHAVANTAGE_API_KEY || secrets.ALPHA_VANTAGE_KEY || secrets.ALPHAVANTAGE_APIKEY || '' }}
      TELEGRAM_BOT_USERNAME: AlisScreenerBot
      TELEGRAM_BOT_URL: https://t.me/AlisScreenerBot
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      STORAGE_BACKEND: local_json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore scanner state
        uses: actions/cache/restore@v5
        with:
          path: |
            data/state
            data/research
            data/raw
          key: swingsuite-state-${{ github.run_id }}
          restore-keys: |
            swingsuite-state-
      - name: Run one-off intraday scan now
        run: python -m scanner.run_scan intraday
      - name: Save scanner state
        if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            data/state
            data/research
            data/raw
          key: swingsuite-state-${{ github.run_id }}
      - name: Upload one-off report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: one-off-intraday-report
          path: |
            reports/intraday/latest.md
            reports/intraday/latest.json
            reports/intraday/latest.html
            data/research/research.sqlite3
            logs/notifications.log
          if-no-files-found: ignore
